name: Build and Test

# Builds and tests pull requests, and runs when started by hand ('Run workflow').
# It does not run on pushes: nothing in this repository runs for every commit. Releases are
# built by release.yml when a version tag is pushed.
on:
  pull_request:
    branches:
      - master  # PRs targeting trunk
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # Only need to checkout repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      # The web UI is built first: Maven puts webui/dist into the jar.
      - name: Check and build the web UI
        working-directory: webui
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

      - name: Build and Test with Coverage
        run: |
          COMMIT_TIME=$(git log -1 --format=%cI)
          mvn --batch-mode verify -Pcoverage -Dproject.build.outputTimestamp=$COMMIT_TIME

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          report_type: coverage
          files: target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
