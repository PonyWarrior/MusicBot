name: 'Docker Build and Push'
description: 'Builds and pushes a multi-arch Docker image to GHCR with caching'

inputs:
  tags:
    description: 'Docker image tags (from metadata-action)'
    required: true
  annotations:
    description: 'OCI annotations from metadata-action (for multi-arch images)'
    required: true
  timestamp:
    description: 'Build timestamp in ISO 8601 format'
    required: true
  registry:
    description: 'Container registry (e.g., ghcr.io)'
    required: false
    default: 'ghcr.io'
  image-name:
    description: 'Image name (e.g., ponywarrior/musicbot)'
    required: false
    default: 'ponywarrior/musicbot'
  token:
    description: 'GitHub token for authentication'
    required: true

outputs:
  digest:
    description: 'Docker image digest'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      with:
        driver-opts: |
          network=host

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ inputs.tags }}
        annotations: ${{ inputs.annotations }}
        cache-from: |
          type=gha
          type=registry,ref=${{ inputs.registry }}/${{ inputs.image-name }}:buildcache
        cache-to: |
          type=gha,mode=max
          type=registry,ref=${{ inputs.registry }}/${{ inputs.image-name }}:buildcache,mode=max
        platforms: linux/amd64,linux/arm64
        build-args: |
          BUILD_TIMESTAMP=${{ inputs.timestamp }}

    - name: Image digest
      shell: bash
      run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
